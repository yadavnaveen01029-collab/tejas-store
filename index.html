<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teja's Store</title>

<style>
body{
margin:0;
background:#111;
color:white;
font-family:Arial,sans-serif;
}
header{
background:#000;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}
.hero{
padding:40px 20px;
text-align:center;
}
.btn{
background:#00c853;
color:white;
padding:12px 25px;
border-radius:8px;
text-decoration:none;
display:inline-block;
margin-top:15px;
}
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:20px;
}
.card{
background:#222;
padding:15px;
border-radius:12px;
text-align:center;
}
.card img{
width:100%;
border-radius:10px;
}
</style>
</head>

<body>

<header>🛒 Teja's Store</header>

<div class="hero">
<h1>Everything You Need, In One Place</h1>
<p>Apps • AI Tools • Deals • Templates</p>
<a href="#" class="btn">Explore</a>
</div>

<div class="products">

<div class="card">
<h2>ChatGPT</h2>
<p>Best AI Assistant</p>
<a class="btn" href="https://chat.openai.com">Open</a>
</div>

<div class="card">
<h2>CapCut</h2>
<p>Best Video Editor</p>
<a class="btn" href="https://www.capcut.com">Download</a>
</div>

</div>

</body>
</html>
